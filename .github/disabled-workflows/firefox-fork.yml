name: Firefox fork verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify Firefox fork
    runs-on: [self-hosted, Linux, ARM64, leopere, local]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zip

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release bundle
        run: npm --workspace @bitwarden/browser run release:check:fork:firefox

      - name: Upload unsigned test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultwarden-companion-firefox-${{ github.sha }}
          path: apps/browser/dist/release/
          if-no-files-found: error
          retention-days: 14
